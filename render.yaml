services:
  - type: web
    name: moviedb-backend
    env: node
    buildCommand: npm install && npm run build --workspace=backend
    startCommand: npm start --workspace=backend
    envVars:
      - key: PORT
        value: 5000
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
